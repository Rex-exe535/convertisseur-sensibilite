<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convertisseur de sensibilité FPS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f9;--card:#fff;--tx:#161a2b;--mu:#5b6177;--ac:#5b4bff;--bd:#dfe2ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#eef0fb;--mu:#9aa1bd;--ac:#8b7fff;--bd:#2a3050}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#eef0fb;--mu:#9aa1bd;--ac:#8b7fff;--bd:#2a3050}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px;color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:4px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.res{text-align:center}
.big{font-size:2.4rem;font-weight:700;color:var(--ac)}
.small{color:var(--mu);font-size:.9rem}
small.note{display:block;color:var(--mu);margin-top:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Convertisseur de sensibilité</h1>
<p class="sub">Garde la même vitesse de souris d’un jeu à l’autre.</p>

<div class="card">
<h2>Ton jeu actuel</h2>
<div class="row">
<div><label for="g1">Jeu</label><select id="g1"></select></div>
<div><label for="d1">DPI de la souris</label><input id="d1" type="number" value="800" min="50" step="50"></div>
<div><label for="s1">Sensibilité</label><input id="s1" type="number" value="1.2" min="0" step="0.01"></div>
</div>
</div>

<div class="card">
<h2>Jeu cible</h2>
<div class="row">
<div><label for="g2">Jeu</label><select id="g2"></select></div>
<div><label for="d2">DPI de la souris</label><input id="d2" type="number" value="800" min="50" step="50"></div>
<div></div>
</div>
</div>

<div class="card res">
<div class="small">Sensibilité à utiliser dans le jeu cible</div>
<div class="big" id="out">–</div>
<div class="small" id="cm">–</div>
<small class="note">Les valeurs sont approximatives selon les mises à jour des jeux. Vérifie toujours en jeu.</small>
</div>
</main>
<script>
var GAMES=[
{n:"Counter-Strike 2",y:0.022},
{n:"Valorant",y:0.07},
{n:"Apex Legends",y:0.022},
{n:"Overwatch 2",y:0.0066},
{n:"Call of Duty",y:0.0066},
{n:"Fortnite (sensibilité X en %)",y:0.005555}
];
var g1=document.getElementById("g1"),g2=document.getElementById("g2");
GAMES.forEach(function(g,i){g1.add(new Option(g.n,i));g2.add(new Option(g.n,i));});
g2.value=1;
function calc(){
var a=GAMES[g1.value],b=GAMES[g2.value];
var d1=parseFloat(document.getElementById("d1").value),s1=parseFloat(document.getElementById("s1").value),d2=parseFloat(document.getElementById("d2").value);
if(!(d1>0&&s1>0&&d2>0)){document.getElementById("out").textContent="–";document.getElementById("cm").textContent="–";return;}
var res=(d1*s1*a.y)/(d2*b.y);
var cm=(2.54*360)/(d1*s1*a.y);
document.getElementById("out").textContent=res.toFixed(3);
document.getElementById("cm").textContent="Soit "+cm.toFixed(1)+" cm pour faire un tour complet (360°)";
}
["g1","g2","d1","s1","d2"].forEach(function(id){document.getElementById(id).addEventListener("input",calc);});
calc();
</script>
</body>
</html>
